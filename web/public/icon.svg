<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3f4f6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Briefcase Icon Graphics -->
  <g filter="url(#shadow)" transform="translate(106, 116)">
    <!-- Handle -->
    <path d="M 100 80 C 100 44, 124 24, 150 24 L 150 24 C 176 24, 200 44, 200 80 L 200 88 L 100 88 Z" fill="none" stroke="url(#iconGrad)" stroke-width="24" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="10" y="88" width="280" height="190" rx="32" fill="url(#iconGrad)"/>
    <!-- Center Lock Accent -->
    <circle cx="150" cy="183" r="22" fill="#2563eb"/>
    <path d="M 150 171 L 150 195" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
