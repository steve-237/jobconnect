<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#2563eb" flood-opacity="0.4"/>
    </filter>

    <!-- Dot Pulse Shadow -->
    <filter id="dotShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Main Rounded Container -->
  <rect width="512" height="512" rx="136" fill="url(#bgGrad)"/>

  <!-- Inner Soft Glow Border -->
  <rect x="8" y="8" width="496" height="496" rx="128" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="8"/>

  <!-- Centered Lightning Bolt (Zap Icon) -->
  <g filter="url(#glow)" transform="translate(100, 76)">
    <!-- High Contrast Bold Lightning Bolt -->
    <path d="M 176 32 L 64 216 H 164 L 136 320 L 248 136 H 148 Z" 
          fill="#ffffff" 
          transform="scale(1.15) translate(-10, -10)"/>
  </g>

  <!-- Top Right Emerald Active Job Pulse Dot -->
  <circle cx="396" cy="116" r="32" fill="#10b981" filter="url(#dotShadow)" stroke="#ffffff" stroke-width="8"/>
  <circle cx="396" cy="116" r="16" fill="#ecfdf5"/>
</svg>
