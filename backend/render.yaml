services:
  # 1. Base de données PostgreSQL (Plan Gratuit)
  - type: postgres
    name: jobconnect-db
    plan: free
    ipAllowList: [] # Permet les connexions internes sur Render

  # 2. Service Backend API NestJS (Plan Gratuit)
  - type: web
    name: jobconnect-api
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobconnect-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true # Génère un secret aléatoire en toute sécurité
      - key: STRIPE_SECRET_KEY
        value: sk_test_placeholder_remplacer_sur_render
      - key: PORT
        value: 10000 # Port standard sur Render
